name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows executable
        run: |
          python -m pip install Pillow==12.2.0 PyInstaller==6.17.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name image_optimizer_app image_optimizer_app.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Expected a release tag such as v1.0.0."
          }
          gh release create "$env:RELEASE_TAG" dist/image_optimizer_app.exe --target "$env:GITHUB_SHA" --title "$env:RELEASE_TAG" --generate-notes
